<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mudora - ALttPR ROM Inspector</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <input type="file" id="rom-input" accept=".sfc,.smc">
    <input type="text" id="search" placeholder="Search item..." disabled>
    <button id="search-button" disabled>Search</button>
    <button id="clear" disabled>Clear</button>
    <span id="version"></span>
    <a href="https://github.com/alttpr-mudora/mudora" target="_blank" rel="noopener">GitHub</a>
  </header>
  <div id="rom-header" class="heading-container">
    <p id="status" class="status">Choose a ROM file. It is parsed entirely in your browser and never uploaded.</p>
    <div id="startscreen-code" style="display:none;">
      <p class="status">Code:</p>
    </div>
    <div id="permalink-container" style="display:none;">
      <p class="status">Permalink:</p>
      <a id="permalink" target="_blank">-</a>
    </div>
  </div>
  <div id="results"></div>
  <hr id="results-playthrough-divider" hidden>
  <div id="playthrough"></div>

  <script src="wasm_exec.js"></script>
  <script src="app.js"></script>
</body>
</html>
